<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script>
  // Narrow-viewport guard: routes phones (and narrow desktop windows) to the
  // single-column /m page BEFORE the board assets load. The server also
  // UA-sniffs "/"; this catches phones that spoof a desktop UA and windows
  // narrowed after load. ?desktop=1 forces the full board.
  (function () {
    try {
      if (window.location.search.indexOf('desktop=1') !== -1) return;
      var w = Math.min(window.innerWidth || 9999,
                       (window.screen && window.screen.width) || 9999);
      if (w < 768) window.location.replace('/m');
    } catch (e) { /* never block the desktop board */ }
  })();
</script>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>★ POLARIS · BOARD</title>
<link rel="stylesheet" href="static/polaris.css"/>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070b; color: var(--p-wht);
    font-family: var(--font-mono);
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(95,135,175,0.10), transparent 60%),
      radial-gradient(ellipse at 30% 70%, rgba(215,175,255,0.04), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  /* Jin 2026-07-10 (feat/visual-wall-director, Part B): the globe moved to
     /flow (the "visual wall" director-mode page combining globe + pipeline
     river) — index.html ("/") is now the WORK BOARD, full-width, no sphere.
     .board-shell = a 3-row flex column: slim pagenav strip, #board
     (flex:1, overrides board.js's own injected `height:100vh` via higher
     selector specificity — board.js's CSS still owns everything ELSE about
     #board's look, untouched), and the bot log strip (moved down from the
     old 30%-left column, same botlog-pane markup/CSS/JS — board.js already
     polls #botlog-body unconditionally, see board.js init()). */
  .board-shell { display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden; }
  .board-shell #board { flex: 1 1 auto; min-height: 0; height: auto; }
  .board-shell .botlog-pane { flex: 0 0 90px; height: 90px; }

  .pagenav-strip {
    flex: 0 0 auto;
    display: flex; justify-content: flex-end; align-items: center; gap: 16px;
    padding: 4px 16px;
    font-size: 11px; letter-spacing: 0.06em;
    background: rgba(5,7,11,0.9);
    border-bottom: 1px solid var(--ghost);
  }
  .pagenav-strip a { color: var(--p-dim); text-decoration: none; }
  .pagenav-strip a.active { color: var(--polaris-blue); }
  .pagenav-strip a:hover { color: var(--p-wht); }

  /* Bot log pane (now a fixed-height strip under the board — see .board-shell) */
  .botlog-pane {
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    border-top: 1px solid var(--ghost);
    background: rgba(5,7,11,0.92);
    font-family: var(--font-mono);
  }
  .botlog-pane .bl-head {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    padding: 3px 7px; border-bottom: 1px solid var(--ghost);
    color: var(--polaris-blue); font-size: 8px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .botlog-pane .bl-head .live { color: var(--p-grn); font-size: 7px; letter-spacing: 0.08em; }
  .botlog-pane .bl-head .live::before { content: '●'; margin-right: 3px; }
  /* 30% column is narrow → smaller font + horizontal scroll fallback so log stays readable */
  .botlog-pane .bl-body {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: auto;
    padding: 3px 7px 5px; font-size: 9px; line-height: 1.3;
  }
  .botlog-pane .bl-body::-webkit-scrollbar { width: 5px; height: 5px; }
  .botlog-pane .bl-body::-webkit-scrollbar-thumb { background: var(--ghost); }
  .botlog-pane .bl-line { white-space: pre-wrap; word-break: break-word; color: var(--p-dim); padding: 0.5px 0; }
  .botlog-pane .bl-line .ts { color: #6c6c6c; }
  .botlog-pane .bl-err  { color: var(--p-red); }
  .botlog-pane .bl-warn { color: var(--p-ylw); }
  .botlog-pane .bl-hi   { color: var(--p-cyn); font-weight: 700; }
  /* board.js owns #board styling (full-width work board) */

  /* legacy — superseded by .side-rail */

  /* ── Side rail base ─────────────────────────────────────────── */
  .side-rail {
    position: absolute; top: 80px;
    width: 280px;
    z-index: 10;
    background: rgba(5,7,11,0.65);
    border: 1px solid var(--ghost);
    padding: 12px 14px 8px;
    backdrop-filter: blur(3px);
    font-size: 11px;
    max-height: calc(100vh - 120px);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .side-rail.left  { left: 24px; }
  .side-rail.right { right: 24px; }
  /* Right rail leaves room for bottom-right PIPELINE strip + .bottom strip */
  .side-rail.right { max-height: calc(100vh - 360px); }
  /* Left rail uses full vertical (no bottom widget on left) */
  .side-rail.left  { max-height: calc(100vh - 130px); }
  .side-rail .heading {
    color: var(--polaris-blue);
    letter-spacing: 0.22em;
    font-weight: 700;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--ghost);
    margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .side-rail .heading.sub { margin-top: 10px; }
  .side-rail .heading .cnt { color: var(--p-cyn); font-size: 11px; letter-spacing: 0; }
  .side-rail .scroll-area {
    overflow-y: auto;
    flex: 1 1 0;
    min-height: 0;
  }
  .side-rail .scroll-area::-webkit-scrollbar { width: 3px; }
  .side-rail .scroll-area::-webkit-scrollbar-thumb { background: var(--ghost); }
  .plrow {
    display: grid;
    grid-template-columns: 28px 50px 12px 1fr 50px;
    gap: 5px;
    align-items: center;
    padding: 3px 0;
    font-size: 11px;
    border-bottom: 1px dotted rgba(95,135,175,0.10);
  }
  .plrow.cls {
    grid-template-columns: 28px 50px 12px 60px 50px;
  }
  .plrow .ex { color: var(--p-cyn); font-size: 9px; font-weight: 700; letter-spacing: 0.10em; }
  .plrow .tk { color: var(--p-wht); font-weight: 700; letter-spacing: 0.04em; }
  .plrow .dir.long  { color: var(--p-grn); font-weight: 700; }
  .plrow .dir.short { color: var(--p-red); font-weight: 700; }
  .plrow .px { color: var(--p-gry); text-align: right; font-size: 10px; font-variant-numeric: tabular-nums; }
  .plrow .pn { text-align: right; font-size: 10px; font-variant-numeric: tabular-nums; }
  .plrow .pn.pos { color: var(--p-grn); }
  .plrow .pn.neg { color: var(--p-red); }
  .plrow .exit { color: var(--p-mag); text-align: right; font-size: 9px; letter-spacing: 0.05em; }

  /* Exchange PnL panel (3 sub-cluster summary) */
  #expnl-list { padding: 4px 0 6px; }
  .expnl-row {
    display: grid;
    grid-template-columns: 36px 1fr 60px;
    gap: 8px;
    align-items: center;
    padding: 4px 0;
    font-size: 11px;
  }
  .expnl-row .ex { color: var(--polaris-blue); font-weight: 700; letter-spacing: 0.10em; }
  .expnl-row .cnt { color: var(--p-dim); font-size: 10px; }
  .expnl-row .pn { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .expnl-row .pn.pos { color: var(--p-grn); }
  .expnl-row .pn.neg { color: var(--p-red); }

  /* legacy pipeline-mini class (still used for fallback) */
  .pipeline-mini {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--ghost);
    font-size: 10px;
    color: var(--p-dim);
  }
  .pipeline-mini .row {
    display: grid;
    grid-template-columns: 10px 36px 18px 1fr;
    gap: 6px;
    align-items: center;
    padding: 2px 0;
  }
  .pipeline-mini .swatch { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
  .pipeline-mini .name { color: var(--p-wht); font-weight: 700; }
  .pipeline-mini .tier { color: var(--p-dim); font-size: 9px; }

  /* ── Title block (pre-existing, orphaned — no consumer markup even before
     this change; left untouched, not this change's mess) ────────────────── */
  .title-block { position: absolute; bottom: 60px; left: 24px; z-index: 10; pointer-events: none; }
  .title-block .t1 { font-size: 18px; font-weight: 700; letter-spacing: 0.28em; color: var(--p-wht); }
  .title-block .t2 { font-size: 10px; letter-spacing: 0.30em; color: var(--p-dim); margin-top: 4px; }
</style>
</head>
<body>

<!-- Jin 2026-07-10 (feat/visual-wall-director, Part B): globe moved to /flow
     (the visual-wall director-mode page). "/" is now the full-width work
     board — no sphere canvas, no globe scripts. -->
<div class="board-shell">
  <div class="pagenav-strip">
    <a href="/" class="active">BOARD</a>
    <a href="/flow">FLOW ▸</a>
  </div>

  <!-- Full-width analytics board (native HTML/CSS, rendered by board.js). -->
  <div id="board"></div>

  <!-- Bot log strip (moved down from the old 30%-left globe column; same
       markup/CSS — board.js already polls #botlog-body unconditionally). -->
  <div class="botlog-pane">
    <div class="bl-head"><span>BOT LOG</span><span class="live">live</span></div>
    <div class="bl-body" id="botlog-body"></div>
  </div>
</div>

<!-- board.js (core shell: header + 3-stream summary + tab strip + poll) MUST
     load before board_tabs.js (the 8 full-width tab renderers), which depends
     on window.PolarisBoard. -->
<script src="static/board.js?v=19_globepulsesync"></script>
<!-- board_exchange.js (E3 exchange selector: clickable lanes + ALL toggle +
     venue scope helpers) loads after board.js (needs window.PolarisBoard) and
     before the tab modules (which read its scope helpers). Its
     window.PolarisGlobe.focusExchange() call is guarded (globe is gone from
     this page — no-ops safely, see board_exchange.js). -->
<script src="static/board_exchange.js?v=2_bloomberg_dense"></script>
<script src="static/board_tabs.js?v=20_perfcollapse_gatesplit"></script>
<script src="static/board_tabs_ext.js?v=17_venuebreak_gatesplit"></script>
<!-- board_reference.js (reference-tab renderers: 개발/가야할길/배운것 — static
     fetch-once from /api/buildlog · /api/roadmap · /api/lessons, NOT the 1s
     snapshot poll). Loads LAST so its build/path/learned registrations override
     board_tabs_ext.js's P3 placeholders. Needs window.PolarisBoard(Tabs). -->
<script src="static/board_reference.js?v=4_ai_debate_fold"></script>
<!-- Chart tab: vendored TradingView Lightweight Charts (Apache-2.0) + the
     self-contained chart renderer. Display-only; reads /api/ticker_chart. The
     vendor lib must precede chart.js (it provides window.LightweightCharts). -->
<script src="static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="static/chart.js?v=4_footer_insert_fix"></script>
<!-- Weekend tab: self-contained weekend operations board. Display-only; reads
     the read-only /api/weekend endpoint. Self-injects #pane-weekend + registers
     its renderer (same pattern as chart.js). -->
<script src="static/weekend.js?v=2_footer_insert_fix"></script>
</body>
</html>
