<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>★ POLARIS · FLOW</title>
<link rel="stylesheet" href="static/polaris.css"/>
<style>
  /* "Synaptic Spine" (Jin 2026-07-10, feat/jarvis-wall — supersedes the
     "Flat Neural Map"/"Living Pipeline River" split-pane layout): the G1..G8
     gate pipeline is now one braided spine that dissolves into the universe/
     strategy constellation around it — a single canvas, not a grid-and-lanes
     dashboard. Philosophy doc: vault/50_research/
     wall_design_philosophy_synaptic_current.md. Engine = wall_spine_field.js
     (layout/edges/whisper-mesh/static pre-render) + wall_spine.js (canvas/
     rAF/gate cores/comets) + wall_spine_hud.js (real data wiring). Page is
     still a 30/70 split: left = the /m mobile board embedded live via
     iframe, right = the spine canvas + bottom HUD (score_F gauge strip / bot
     log / equity). ?nomobile=1 hides the iframe and gives the wall stack the
     full width. English UI, Bloomberg-dense, polaris.css tokens only. */
  /* Jarvis visual-language pass (Jin 2026-07-10, feat/jarvis-language):
     material/symbol-language refinement on the SAME Synaptic Spine structure
     above (hairline reticles, target-lock brackets, callout leader lines,
     strategy score_F reticle, watch bracket chips, static engineering
     graticule, numeric HUD blocks) — new draw logic lives in the sibling
     wall_spine_deco.js, loaded between wall_spine_field.js and wall_spine.js
     below. Philosophy doc unchanged: vault/50_research/
     wall_design_philosophy_synaptic_current.md. */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #03040a; color: var(--p-wht);
    font-family: var(--font-mono);
    overflow: hidden;
  }

  .wall-page { display: flex; flex-direction: row; width: 100vw; height: 100vh; overflow: hidden; }
  .mobile-pane {
    flex: 0 0 30%; height: 100%; min-width: 0;
    border-right: 1px solid var(--ghost); overflow: hidden; background: #03040a;
    display: flex; flex-direction: column;
  }
  .mobile-pane iframe { display: block; width: 100%; flex: 1 1 auto; border: 0; min-height: 0; }
  /* side work pane — two stacked halves, dense mono rows */
  .side-sec { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid var(--ghost); }
  .side-h { flex: 0 0 auto; padding: 6px 10px 4px; font-size: 9.5px; letter-spacing: 0.12em; color: var(--p-gry); font-weight: 700; }
  .side-h span { color: var(--p-dim); font-weight: 400; }
  .side-sum { flex: 0 0 auto; display: flex; gap: 12px; padding: 1px 10px 5px; font-size: 10px; color: var(--p-gry); font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--ghost); }
  .side-sum b { font-weight: 700; color: var(--p-wht); }
  .side-sum .vc { font-size: 9px; }
  .side-rows { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 8px 6px; font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .side-rows .r { display: grid; grid-template-columns: 3px 16px 1fr 12px 58px 62px 42px 38px; gap: 5px; align-items: baseline; padding: 2.5px 0; border-bottom: 1px solid rgba(255,255,255,0.045); white-space: nowrap; }
  .fx-up { animation: fxup 0.4s ease-out; } .fx-dn { animation: fxdn 0.4s ease-out; }
  @keyframes fxup { 0% { background: rgba(125,255,168,0.35); } 100% { background: transparent; } }
  @keyframes fxdn { 0% { background: rgba(255,125,138,0.35); } 100% { background: transparent; } }
  .side-rows .r > span { overflow: hidden; text-overflow: ellipsis; }
  .side-rows .vb { width: 3px; height: 10px; border-radius: 1px; align-self: center; }
  .side-rows .vt { font-size: 8px; color: var(--p-dim); }
  .side-rows .sym { color: var(--p-wht); font-weight: 700; }
  .side-rows .num { text-align: right; }
  .side-act .r { grid-template-columns: 46px 34px 1fr 58px; }
  .side-act .t { color: var(--p-dim); font-size: 9px; }
  .side-act .k { font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; }
  .pos-c { color: #7dffa8; } .neg-c { color: #ff7d8a; } .flat-c { color: var(--p-gry); }
  .mobile-pane .open-board-bar {
    flex: 0 0 auto; display: block; text-align: center;
    padding: 5px 0; font-size: 9.5px; letter-spacing: 0.06em;
    color: var(--polaris-blue); text-decoration: none;
    border-top: 1px solid var(--ghost); background: rgba(95,135,175,0.08);
  }
  .mobile-pane .open-board-bar:hover { background: rgba(95,135,175,0.18); color: var(--p-wht); }
  .wall-col { flex: 1 1 70%; height: 100%; min-width: 0; }
  .wall-page.nomobile .mobile-pane { display: none; }
  .wall-page.nomobile .wall-col { flex: 1 1 100%; }

  .wall-stage { display: grid; grid-template-rows: 1fr 22px 96px; width: 100%; height: 100%; overflow: hidden; }

  /* ── Spine pane (fills the remaining vertical space) ─────────────────── */
  .spine-pane { position: relative; width: 100%; height: 100%; overflow: hidden; min-height: 0; background: #03040a; }
  canvas#spine-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .wall-topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 8px 14px;
    background: linear-gradient(to bottom, rgba(3,4,10,0.88), transparent);
  }
  .wall-topbar .brand { display: flex; align-items: center; gap: 6px; font-weight: 700; letter-spacing: 0.12em; font-size: 11px; white-space: nowrap; }
  .wall-topbar .brand .star { color: var(--polaris-blue); font-size: 14px; }
  .wall-pagenav { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.06em; white-space: nowrap; }
  .wall-pagenav a { color: var(--p-dim); text-decoration: none; }
  .wall-pagenav a.active { color: var(--polaris-blue); }
  .wall-pagenav a:hover { color: var(--p-wht); }
  .wall-pagenav a.board-btn {
    color: var(--p-wht); border: 1px solid var(--polaris-blue); border-radius: 3px;
    padding: 3px 9px; font-weight: 700; background: rgba(95,135,175,0.14);
  }
  .wall-pagenav a.board-btn:hover { background: rgba(95,135,175,0.28); color: var(--p-wht); }
  .wall-venues { display: flex; gap: 9px; font-size: 9px; color: var(--p-gry); white-space: nowrap; }
  .wall-venues span::before { content: '●'; margin-right: 3px; }
  .wall-venues .v-okx { color: #5fdfff; }
  .wall-venues .v-cap { color: #a87cff; }
  .wall-venues .v-alp { color: #ffc84f; }
  .wall-summary { display: flex; gap: 14px; margin-left: auto; font-size: 9.5px; color: var(--p-gry); flex-wrap: wrap; }
  .wall-summary .lbl { color: var(--p-dim); margin-right: 4px; }
  /* Jarvis numeric HUD block (Jin 2026-07-10, feat/jarvis-language): a thin
     hairline rule above the tabular figure reads as a small readout block,
     matching the gate-canvas numeric blocks (wall_spine.js drawGates()). */
  .wall-summary .val { color: var(--p-wht); font-weight: 700; font-variant-numeric: tabular-nums; border-top: 1px solid rgba(159,192,255,0.3); padding-top: 1px; }

  /* Kill feed — real G3/G4/G5 KILL decisions (top-right, newest on top, capped 6). */

  /* Class-transition badge pop ("EARN▲" / "BENCH▼") — flow_classes.js owns. */
  #class-badges {
    position: absolute; left: 10px; top: 34px; z-index: 10;
    display: flex; flex-direction: column; gap: 3px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
  }
  #class-badges .badge { padding: 2px 7px; border: 1px solid currentColor; background: rgba(3,4,10,0.75); animation: badgepop 3.2s ease-out forwards; }
  #class-badges .badge.earn  { color: var(--pnl-pos); }
  #class-badges .badge.bench { color: var(--pnl-neg); }
  @keyframes badgepop {
    0%   { opacity: 0; transform: translateY(-4px); }
    10%  { opacity: 1; transform: translateY(0); }
    80%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #candidate-flash {
    position: absolute; z-index: 9; top: 4px; left: 8px;
    font-size: 8px; font-weight: 700; letter-spacing: 0.10em;
    color: var(--p-ylw); white-space: nowrap;
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  #candidate-flash.show { opacity: 1; }

  #drop-panel {
    position: absolute; left: 8px; bottom: 8px; z-index: 9;
    width: 224px; font-size: 9px; color: var(--p-gry);
    background: rgba(3,4,10,0.72); border: 1px solid var(--ghost); padding: 5px 8px;
  }
  #drop-panel .h { color: var(--p-gry); letter-spacing: 0.14em; font-size: 8px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  #drop-panel .row { display: flex; justify-content: space-between; padding: 1px 0; }
  #drop-panel .row .n { color: var(--p-wht); font-variant-numeric: tabular-nums; }
  #drop-panel .empty { color: var(--p-dim); font-style: italic; }

  /* Per-strategy score_F window-fill gauge strip — flow_classes.js renders. */
  #class-gauge-strip {
    position: relative; z-index: 9; overflow-x: auto; white-space: nowrap;
    padding: 2px 8px; font-size: 8px; letter-spacing: 0.04em;
    border-top: 1px solid var(--ghost); background: rgba(3,4,10,0.65);
  }
  #class-gauge-strip::-webkit-scrollbar { height: 3px; }
  #class-gauge-strip::-webkit-scrollbar-thumb { background: var(--ghost); }
  #class-gauge-strip .chip { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; color: var(--p-gry); }
  #class-gauge-strip .chip .sid { color: var(--p-wht); font-weight: 700; }
  #class-gauge-strip .chip .gauge { display: inline-block; width: 34px; height: 6px; background: rgba(255,255,255,0.10); vertical-align: middle; }
  #class-gauge-strip .chip .gauge .fill { display: block; height: 100%; background: var(--polaris-blue); }
  #class-gauge-strip .chip.earn  .gauge .fill { background: var(--pnl-pos); }
  #class-gauge-strip .chip.bench .gauge .fill { background: var(--pnl-neg); }

  /* ── Bottom ticker: equity / today net / bot log. ─────────────────────── */
  .botlog-pane { position: relative; z-index: 9; height: 96px; overflow: hidden; border-top: 1px solid var(--ghost); background: rgba(3,4,10,0.94); }
  .botlog-pane .bl-head {
    display: flex; align-items: center; gap: 10px; padding: 3px 10px; border-bottom: 1px solid var(--ghost);
    color: var(--polaris-blue); font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .botlog-pane .bl-head .live { color: var(--p-grn); font-size: 7px; letter-spacing: 0.08em; }
  .botlog-pane .bl-head .live::before { content: '●'; margin-right: 3px; }
  .botlog-pane .bl-head .metric { margin-left: auto; color: var(--p-dim); font-weight: 400; }
  .botlog-pane .bl-head .metric b { color: var(--p-wht); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 4px; border-top: 1px solid rgba(159,192,255,0.3); padding-top: 1px; }
  .botlog-pane .bl-head .metric b.pos { color: var(--pnl-pos); } .botlog-pane .bl-head .metric b.neg { color: var(--pnl-neg); }
  /* Equity "vitality pulse" — small HUD addition (radial-inspired): the
     number itself breathes gently, a quiet always-on life-sign rather than a
     new full-screen effect (unbroken-current philosophy, element-local). */
  .botlog-pane .bl-head .metric b.pulse-pos { animation: eqpulse-pos 2.4s ease-in-out infinite; }
  .botlog-pane .bl-head .metric b.pulse-neg { animation: eqpulse-neg 2.4s ease-in-out infinite; }
  @keyframes eqpulse-pos { 0%,100% { opacity: 1; } 50% { opacity: 0.62; } }
  @keyframes eqpulse-neg { 0%,100% { opacity: 1; } 50% { opacity: 0.62; } }
  .botlog-pane .bl-body { height: 72px; overflow-y: auto; padding: 3px 10px 5px; font-size: 9.5px; line-height: 1.35; }
  .botlog-pane .bl-body::-webkit-scrollbar { width: 5px; }
  .botlog-pane .bl-body::-webkit-scrollbar-thumb { background: var(--ghost); }
  .botlog-pane .bl-line { white-space: pre-wrap; word-break: break-word; color: var(--p-dim); padding: 0.5px 0; }
  .botlog-pane .bl-line .ts { color: #6c6c6c; }
  .botlog-pane .bl-err  { color: var(--p-red); }
  .botlog-pane .bl-warn { color: var(--p-ylw); }
  .botlog-pane .bl-hi   { color: var(--p-cyn); font-weight: 700; }
</style>
</head>
<body>

<div class="wall-page" id="wall-page">
  <div class="mobile-pane" id="mobile-pane"></div>

  <div class="wall-col">
    <div class="wall-stage">
      <div class="spine-pane">
        <canvas id="spine-canvas"></canvas>

        <div class="wall-topbar">
          <div class="brand"><span class="star">★</span>POLARIS · FLOW</div>
          <div class="wall-pagenav">
            <a href="/" class="board-btn">‹ BOARD</a>
            <a href="/flow" class="active">FLOW</a>
          </div>
          <div class="wall-venues">
            <span class="v-okx">OKX</span><span class="v-cap">CAPITAL</span><span class="v-alp">ALPACA</span>
          </div>
          <div class="wall-summary" id="summary-strip">
            <span><span class="lbl">SIG→SIZED</span><span class="val" id="s-sig2sized">–</span></span>
            <span><span class="lbl">SIZED→FILL</span><span class="val" id="s-sized2fill">–</span></span>
            <span><span class="lbl">AI CALLS</span><span class="val" id="s-ai">–</span></span>
            <span><span class="lbl">DROPS</span><span class="val" id="s-drops">–</span></span>
            <span><span class="lbl">SHADOW</span><span class="val" id="s-shadow">–</span></span>
            <span><span class="lbl">UNIVERSE FIRING</span><span class="val" id="s-universe">–</span></span>
          </div>
        </div>

                <div id="class-badges"></div>
        <div id="candidate-flash"></div>

        <div id="drop-panel">
          <div class="h"><span id="drop-window">DROP LANE</span><span id="drop-total">0</span></div>
          <div id="drop-rows"><div class="empty">no drops in window</div></div>
        </div>
      </div>

      <div id="class-gauge-strip"></div>

      <div class="botlog-pane">
        <div class="bl-head">
          <span>BOT LOG</span><span class="live">live</span>
          <span class="metric">EQUITY<b id="bl-equity">–</b></span>
          <span class="metric">TODAY<b id="bl-today">–</b></span>
        </div>
        <div class="bl-body" id="botlog-body"></div>
      </div>
    </div>
  </div>
</div>

<!-- Left 30% work pane (Jin 2026-07-10 "모바일 빼고 반 갈라서"): top half =
     live OPEN POSITIONS, bottom half = ACTIVITY feed (trade/gate events
     scrolling up, jarvis-style). The bottom-of-wall BOT LOG stays the system
     log. ?nomobile=1 hides the pane (full-width wall). wall_side.js drives. -->
<script>
  (function () {
    var nomobile = /(?:^|[?&])nomobile=1(?:&|$)/.test(location.search);
    if (nomobile) { document.getElementById('wall-page').classList.add('nomobile'); return; }
    var pane = document.getElementById('mobile-pane');
    pane.innerHTML =
      '<div class="side-sec side-pos"><div class="side-h">OPEN POSITIONS <span id="side-pos-n"></span></div><div class="side-sum" id="side-pos-sum"></div><div class="side-rows" id="side-pos-rows"></div></div>' +
      '<div class="side-sec side-act"><div class="side-h">ACTIVITY</div><div class="side-rows" id="side-act-rows"></div></div>' +
      '<a class="open-board-bar" href="/">OPEN FULL BOARD ›</a>';
  })();
</script>

<!-- Shared SSE bus (events_bus.js) + pts-classes annotations (flow_classes.js,
     unchanged — gauge strip / EARN·BENCH badges / NEW CANDIDATE flash) + the
     Synaptic Spine engine: wall_spine_field.js (layout/edges/whisper-mesh/
     static pre-render, no canvas of its own) -> wall_spine_deco.js (Jarvis
     decoration layer — strategy score_F reticle / watch bracket chip /
     engineering graticule) -> wall_console_lanes.js (console v2 — measured
     collision-aware label/chip lane placer) -> wall_console_readouts.js
     (console v2 — corner/BAY/ladder readout panels, reads WALL_ZONES/
     nodesOf/screenOf off the field layer) -> wall_spine.js (canvas/rAF
     owner, gate cores, comets, public window.PolarisSpine API — also owns
     the console v2 setConsole/setVerdicts/setFlowSummary/markGatePulse
     state) -> wall_spine_hud.js (the only module doing network I/O —
     graph.json/flow_stats polls + SSE dispatch, drives PolarisSpine + the
     DOM HUD). -->
<script src="static/events_bus.js?v=1"></script>
<script src="static/flow_classes.js?v=1"></script>
<script src="static/wall_spine_field.js?v=41_pipedrop"></script>
<script src="static/wall_spine_deco.js?v=3_consolev2"></script>
<script src="static/wall_console_lanes.js?v=1_consolev2"></script>
<script src="static/wall_console_readouts.js?v=4_final"></script>
<script src="static/wall_spine.js?v=11_consolev2"></script>
<script src="static/wall_spine_hud.js?v=4_consolev2"></script>
<script src="static/wall_side.js?v=5_summary"></script>
<script>
  // The spine canvas fits to canvas clientWidth/Height; after layout settles,
  // nudge resize twice (rAF + delayed) so fitCanvas() picks up the grid-
  // sized pane, not an initial full-size guess.
  window.addEventListener('load', function () {
    requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); });
    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 250);
  });
</script>
</body>
</html>
