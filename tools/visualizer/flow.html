<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>★ POLARIS · FLOW</title>
<link rel="stylesheet" href="static/polaris.css"/>
<style>
  /* Living Pipeline River — gate+AI activity as a left→right flow, desktop-only
     (Jin: "클라우드 글로브처럼, 게이트 액티비티+AI 활동을 하이라키 플로우로 한눈에").
     Canvas 2D — same render stack as the globe (sphere-render.js). English UI,
     Bloomberg-dense: numbers everywhere, no cards. Colors pulled ONLY from the
     dashboard's existing venue palette (polaris.css / index.html legend) — no
     new hues invented. */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070b; color: var(--p-wht);
    font-family: var(--font-mono);
    overflow: hidden;
  }
  .flow-stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  canvas#flow-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── Top bar: brand + nav + 1h summary strip ─────────────────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(to bottom, rgba(5,7,11,0.92), rgba(5,7,11,0.75) 80%, transparent);
    border-bottom: 1px solid var(--ghost);
  }
  .topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.14em; font-size: 12px; white-space: nowrap; }
  .topbar .brand .star { color: var(--polaris-blue); font-size: 16px; }
  .pagenav { display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; }
  .pagenav a { color: var(--p-dim); text-decoration: none; }
  .pagenav a.active { color: var(--polaris-blue); }
  .pagenav a:hover { color: var(--p-wht); }
  .summary-strip { display: flex; gap: 18px; margin-left: auto; font-size: 10.5px; color: var(--p-gry); flex-wrap: wrap; }
  .summary-strip .lbl { color: var(--p-dim); margin-right: 5px; }
  .summary-strip .val { color: var(--p-wht); font-weight: 700; font-variant-numeric: tabular-nums; }
  .summary-strip .val.pos { color: var(--pnl-pos); }
  .summary-strip .win { color: var(--p-dim); font-size: 9px; margin-left: 12px; letter-spacing: 0.08em; }

  /* ── Column headers (JS-positioned to match the canvas stage x-coords) ── */
  #col-headers { position: absolute; top: 46px; left: 0; right: 0; height: 34px; z-index: 9; pointer-events: none; }
  #col-headers .col-h {
    position: absolute; top: 0; transform: translateX(-50%);
    font-size: 9.5px; letter-spacing: 0.12em; color: var(--p-gry);
    text-align: center; white-space: nowrap;
  }
  #col-headers .col-h .n { display: block; font-size: 13px; font-weight: 700; color: var(--p-wht); font-variant-numeric: tabular-nums; }
  #col-headers .col-h.gate { color: var(--polaris-blue); }
  #col-headers .col-h.fills { color: var(--p-grn); }

  /* ── Venue legend (left rail) ─────────────────────────────────────────── */
  .venue-legend { position: absolute; left: 10px; top: 90px; z-index: 9; font-size: 9.5px; display: flex; flex-direction: column; gap: 5px; }
  .venue-legend .row { display: flex; align-items: center; gap: 6px; color: var(--p-gry); }
  .venue-legend .dot { width: 7px; height: 7px; border-radius: 50%; }
  .venue-legend .row.drop { color: var(--p-dim); margin-top: 6px; }
  .venue-legend .dot.drop { background: #7a7f8c; }

  /* ── Drop-lane reason panel (bottom-left, gray = measurement, not a block) ── */
  #drop-panel {
    position: absolute; left: 10px; bottom: 118px; z-index: 9;
    width: 300px; font-size: 10px; color: var(--p-gry);
    background: rgba(5,7,11,0.7); border: 1px solid var(--ghost); padding: 7px 10px;
  }
  #drop-panel .h { color: #9098a8; letter-spacing: 0.16em; font-size: 9px; margin-bottom: 5px; display: flex; justify-content: space-between; }
  #drop-panel .row { display: flex; justify-content: space-between; padding: 1.5px 0; }
  #drop-panel .row .n { color: var(--p-wht); font-variant-numeric: tabular-nums; }
  #drop-panel .empty { color: var(--p-dim); font-style: italic; }

  /* ── AI verdict mini ticker (top-right, below the column-header row) ────── */
  #verdict-ticker {
    position: absolute; right: 10px; top: 86px; z-index: 9;
    width: 300px; font-size: 10px; text-align: right;
    background: rgba(5,7,11,0.7); border: 1px solid var(--ghost); padding: 6px 10px;
  }
  #verdict-ticker .row { padding: 1.5px 0; color: var(--p-gry); }
  #verdict-ticker .row .g { color: var(--polaris-blue); font-weight: 700; margin-right: 5px; }
  #verdict-ticker .row.dim .v { color: var(--p-dim); }
  #verdict-ticker .row.green .v { color: var(--pnl-pos); font-weight: 700; }
  #verdict-ticker .row.amber .v { color: var(--p-ylw); font-weight: 700; }
  #verdict-ticker .row.magenta .v { color: var(--p-mag); font-weight: 700; }

  /* ── Bot log mini strip (bottom, condensed index.html pattern) ─────────── */
  .botlog-pane {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;
    height: 108px; overflow: hidden;
    border-top: 1px solid var(--ghost);
    background: rgba(5,7,11,0.92);
  }
  .botlog-pane .bl-head {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-bottom: 1px solid var(--ghost);
    color: var(--polaris-blue); font-size: 8px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .botlog-pane .bl-head .live { color: var(--p-grn); font-size: 7px; letter-spacing: 0.08em; }
  .botlog-pane .bl-head .live::before { content: '●'; margin-right: 3px; }
  .botlog-pane .bl-body { height: 84px; overflow-y: auto; padding: 3px 10px 5px; font-size: 9.5px; line-height: 1.35; }
  .botlog-pane .bl-body::-webkit-scrollbar { width: 5px; }
  .botlog-pane .bl-body::-webkit-scrollbar-thumb { background: var(--ghost); }
  .botlog-pane .bl-line { white-space: pre-wrap; word-break: break-word; color: var(--p-dim); padding: 0.5px 0; }
  .botlog-pane .bl-line .ts { color: #6c6c6c; }
  .botlog-pane .bl-err  { color: var(--p-red); }
  .botlog-pane .bl-warn { color: var(--p-ylw); }
  .botlog-pane .bl-hi   { color: var(--p-cyn); font-weight: 700; }

  .desktop-note {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    z-index: 9; font-size: 8.5px; color: var(--p-dim); letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<div class="flow-stage">
  <canvas id="flow-canvas"></canvas>

  <div class="topbar">
    <div class="brand"><span class="star">★</span>POLARIS · FLOW</div>
    <div class="pagenav">
      <a href="/">‹ GLOBE</a>
      <a href="/flow" class="active">FLOW</a>
    </div>
    <div class="summary-strip" id="summary-strip">
      <span><span class="lbl">SIG→SIZED</span><span class="val" id="s-sig2sized">–</span></span>
      <span><span class="lbl">SIZED→FILL</span><span class="val" id="s-sized2fill">–</span></span>
      <span><span class="lbl">AI CALLS</span><span class="val" id="s-ai">–</span></span>
      <span><span class="lbl">DROPS</span><span class="val" id="s-drops">–</span></span>
      <span><span class="lbl">SHADOW MISMATCH</span><span class="val" id="s-shadow">–</span></span>
      <span class="win">last 1h</span>
    </div>
  </div>

  <div id="col-headers"></div>

  <div class="venue-legend">
    <div class="row"><span class="dot" style="background:#5fdfff;box-shadow:0 0 6px #5fdfff"></span>OKX</div>
    <div class="row"><span class="dot" style="background:#a87cff;box-shadow:0 0 6px #a87cff"></span>CAPITAL</div>
    <div class="row"><span class="dot" style="background:#ffc84f;box-shadow:0 0 6px #ffc84f"></span>ALPACA</div>
    <div class="row drop"><span class="dot drop"></span>DROP (kill/skip/shadow)</div>
  </div>

  <div id="drop-panel">
    <div class="h"><span>DROP LANE · TOP REASONS (1h)</span><span id="drop-total">0</span></div>
    <div id="drop-rows"><div class="empty">no drops in window</div></div>
  </div>

  <div id="verdict-ticker">
    <div class="row dim">no AI verdicts in window</div>
  </div>

  <div class="botlog-pane">
    <div class="bl-head">BOT LOG <span class="live">LIVE</span></div>
    <div class="bl-body" id="botlog-body"></div>
  </div>

  <div class="desktop-note">DEMO / PAPER · display-only · gate volume 30s · fills/AI live via SSE</div>
</div>

<script src="static/flow.js"></script>
</body>
</html>
